name: Comprobar WEBMUSIC
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    name: Instalar y compilar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis del importador
        run: node --check scripts/import-csv.mjs
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Compilar Nuxt
        run: npm run build

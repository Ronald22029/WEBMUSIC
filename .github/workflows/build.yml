name: Comprobar CieloPlay
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    name: Instalar y compilar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis
        run: |
          node --check scripts/import-csv.mjs
          node --check scripts/smoke-local.mjs
          node --check scripts/smoke-sqlite.mjs
          node --check scripts/export-d1.mjs
          node --check scripts/apply-d1.mjs
          node --check scripts/smoke-export-d1.mjs
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Compilar Nuxt
        run: npm run build
      - name: Prueba funcional del modo local
        run: node scripts/smoke-local.mjs
      - name: Prueba funcional de SQLite
        run: node scripts/smoke-sqlite.mjs
      - name: Comprobar exportación SQLite a D1
        run: node scripts/smoke-export-d1.mjs
      - name: Compilar para Cloudflare Workers (sin desplegar)
        run: npm run build
        env:
          NITRO_PRESET: cloudflare_module
      - name: Probar Workers con D1 local (sin desplegar)
        run: node scripts/smoke-cloudflare.mjs
